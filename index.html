<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KeyStart</title>
  <meta name="theme-color" content="#14151f">
  <meta name="description" content="Impara a suonare la tastiera MIDI: note, giochi e canzoni.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back" aria-label="Indietro" hidden>←</button>
    <h1 id="title">KeyStart</h1>
    <div id="midiStatus" class="pill" title="Stato tastiera">…</div>
  </header>

  <main id="screen" class="screen"></main>

  <footer class="keys-wrap">
    <div id="octaveHint" class="octave-hint"></div>
    <div id="keyboard" class="keyboard" aria-label="Tastiera"></div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/keyboard-view.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/free.js"></script>
  <script src="js/screens/findnote.js"></script>
  <script src="js/screens/songs.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
