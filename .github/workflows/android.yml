name: Costruisci APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installa dipendenze
        run: npm ci

      - name: Prepara la parte web
        run: npm run sync

      - name: Compila APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../KeyStart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KeyStart-apk
          path: KeyStart.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: KeyStart APK ${{ github.run_number }}
          body: |
            Scarica **KeyStart.apk** qui sotto e aprila sul telefono Android per installarla.
            Collega la tastiera MIDI con un cavo USB-C / OTG.
          files: KeyStart.apk
          make_latest: true
